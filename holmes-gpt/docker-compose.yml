services:
  holmes-gpt:
    image: ghcr.io/netdevs-net/holmes-gpt:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Set in .env or replace — required for chat replies
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DB_DIR=/app/data
      # Trust the reverse proxy for client IP / scheme (see env.example)
      - ADDRESS_HEADER=X-Forwarded-For
      - XFF_DEPTH=1
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
    secrets:
      - anthropic_api_key
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

secrets:
  anthropic_api_key:
    external: true
