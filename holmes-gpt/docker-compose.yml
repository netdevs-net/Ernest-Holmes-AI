services:
  holmes-gpt:
    image: ghcr.io/webdevs-net/holmes-gpt:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Set in .env or replace — required for chat replies
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    secrets:
      - anthropic_api_key
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

secrets:
  anthropic_api_key:
    external: true
